name: Build & Release

on:
  push:
    branches:
      - main          # genera artefacto en cada push a main
    tags:
      - 'v*'          # crea un Release oficial cuando haces: git tag v0.5.0

jobs:
  # ── Job 0: pruebas. Sin esto se podia publicar un .tgz roto ───────────────
  # socat crea los puertos serie virtuales de la suite RTU serie; sin el, la
  # suite falla a proposito en lugar de saltarse en silencio.
  test:
    name: npm test (RTU/TCP, Modbus TCP, RTU serie)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar socat
        run: sudo apt-get update && sudo apt-get install -y socat

      # npm ci (no npm install): instala exactamente lo del lock y FALLA si
      # package-lock.json no cuadra con package.json, en vez de reescribirlo.
      - name: Instalar dependencias (incluye serialport)
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  # ── Job 1: siempre que haya push a main ────────────────────────────────────
  build:
    name: npm pack → artefacto
    runs-on: ubuntu-latest
    needs: test                    # no se empaqueta nada que no pase las pruebas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar .tgz
        run: npm pack

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: node-red-contrib-rtu-over-tcp
          path: '*.tgz'
          retention-days: 30        # disponible 30 días en la pestaña Actions

  # ── Job 2: solo cuando haces git tag v* ────────────────────────────────────
  release:
    name: Crear Release en GitHub
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]           # espera a pruebas y build

    permissions:
      contents: write              # necesario para crear el Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar .tgz
        run: npm pack

      - name: Leer versión del package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Crear Release y adjuntar .tgz
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.pkg.outputs.version }}"
          body: |
            ## node-red-contrib-rtu-over-tcp v${{ steps.pkg.outputs.version }}

            ### Instalación en Node-RED
            1. Descarga el `.tgz` adjunto
            2. Node-RED → **Manage Palette → Install → Upload**
            3. Selecciona el archivo y confirma
          files: '*.tgz'
          draft: false
          prerelease: false
